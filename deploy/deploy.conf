# shellcheck shell=bash
# Site-specific deployment values, sourced by deploy/install.sh.
#
# This file is committed. Keep only non-secret values here — credentials live
# in /etc/sip-ledger/env, which is never committed. Every value can also be
# overridden from the environment for a one-off run:
#
#   sudo SIP_DOMAIN=sip.other.example ./deploy/install.sh

# Hostname Caddy serves the API on. Point its A record at the droplet before
# installing, or the certificate request fails.
SIP_DOMAIN="${SIP_DOMAIN:-sip.example.com}"

# Loopback port the API binds to. Caddy is the only thing that reaches it, and
# ufw never opens it.
SIP_PORT="${SIP_PORT:-8412}"

# Node major version. 24+ is required: better-sqlite3 below v13 crashes in
# native destructors on it, and v13 needs a modern ABI.
NODE_MAJOR="${NODE_MAJOR:-24}"

# Fingerprint of the NodeSource APT signing key, checked before the repo is
# trusted. install.sh refuses to continue on a mismatch rather than warning.
#
# VERIFY THIS YOURSELF against https://github.com/nodesource/distributions
# before first use. A pinned fingerprint you have not checked is only
# trust-on-first-use wearing a seatbelt.
NODESOURCE_FPR="${NODESOURCE_FPR:-6F71F525282841EEDAF851B42F59B5F99B1BE0B4}"

# Filesystem layout. StateDirectory= in the units owns STATE_DIR.
APP_DIR="${APP_DIR:-/opt/sip-ledger}"
ETC_DIR="${ETC_DIR:-/etc/sip-ledger}"
STATE_DIR="${STATE_DIR:-/var/lib/sip-ledger}"

# Service account the poller and API run as.
SERVICE_USER="${SERVICE_USER:-sip}"
